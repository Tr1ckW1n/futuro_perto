{% extends 'base.html' %}{% block title %}Editar oportunidade{% endblock %}{% block content %}<section class="wrap section narrow wide-form"><a class="back" href="{{url_for('admin')}}">← Voltar ao painel</a><h1 class="page-title">{{'Editar oportunidade' if r else 'Nova oportunidade'}}</h1><form class="form-card" method="post"><input type="hidden" name="csrf" value="{{csrf_token()}}"><div class="inline-grid"><label>Título *<input name="title" required value="{{r.title if r else ''}}"></label><label>Município *<input name="city" required value="{{r.city if r else ''}}"></label></div><label>Descrição *<textarea name="description" required rows="4">{{r.description if r else ''}}</textarea></label><div class="inline-grid"><label>Instituição *<select name="institution_id" required>{% for i in institutions %}<option value="{{i.id}}" {% if r and r.institution_id==i.id %}selected{% endif %}>{{i.name}}</option>{% endfor %}</select></label><label>Unidade (opcional)<select name="unit_id"><option value="">Sem unidade cadastrada</option>{% for u in units %}<option value="{{u.id}}" {% if r and r.unit_id==u.id %}selected{% endif %}>{{u.city}} · {{u.name}}</option>{% endfor %}</select></label></div><div class="inline-grid"><label>Área de formação *<input name="area" required value="{{r.area if r else ''}}"></label><label>Categoria *<input name="category" required value="{{r.category if r else 'Curso livre'}}"></label></div><div class="inline-grid"><label>Modalidade *<select name="modality">{% for s in modalities %}<option {% if r and r.modality==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></label><label>Carga horária<input name="hours" type="number" min="1" value="{{r.hours if r and r.hours else ''}}"></label></div><label>Requisitos<textarea name="requirements">{{r.requirements if r else ''}}</textarea></label><label>Público-alvo<input name="audience" value="{{r.audience if r else ''}}"></label><div class="inline-grid"><label>Início das inscrições<input name="open_date" type="date" value="{{r.open_date if r and r.open_date else ''}}"></label><label>Fim das inscrições<input name="close_date" type="date" value="{{r.close_date if r and r.close_date else ''}}"></label></div><div class="inline-grid"><label>Situação das inscrições *<select name="status">{% for s in statuses %}<option {% if r and r.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></label><label>Estado editorial *<select name="stage">{% for s in stages %}<option {% if r and r.stage==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></label></div><label>Link oficial de inscrição<input type="url" name="registration_url" placeholder="https://..." value="{{r.registration_url if r and r.registration_url else ''}}"></label><label>Fonte oficial<input type="url" name="source_url" placeholder="https://..." value="{{r.source_url if r and r.source_url else ''}}"></label><div class="inline-grid"><label>Data da verificação<input type="date" name="verified_at" value="{{r.verified_at if r and r.verified_at else ''}}"></label><label>Palavras-chave<input name="keywords" value="{{r.keywords if r else ''}}"></label></div><label class="check"><input type="checkbox" name="demo" value="1" {% if r and r.demo %}checked{% endif %}> Informação exclusivamente demonstrativa, sem inscrição real</label><p class="muted">Para publicar dados reais, informe fonte oficial e data de verificação. Coordenadas são cadastradas na unidade.</p><button class="btn" type="submit">Salvar oportunidade →</button></form></section>{% endblock %}
