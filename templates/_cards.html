{% for r in rows %}<article class="course-card"><div class="course-top"><span class="category">{{r.area}}</span><span class="status {{'open' if r.status=='Inscrições abertas' else 'closed' if r.status=='Inscrições encerradas' else ''}}">{{r.status}}</span></div><h3><a href="{{url_for('detail',oid=r.id)}}">{{r.title}}</a></h3><p class="institution">{{r.institution}}</p><div class="course-meta"><span>⌖ {{r.city}}{% if r.unit %} · {{r.unit}}{% endif %}</span><span>◷ {{r.modality}}{% if r.hours %} · {{r.hours}}h{% endif %}</span></div>{% if r.demo %}<p class="demo-tag">Exemplo fictício · não disponível para inscrição</p>{% endif %}<a class="card-link" href="{{url_for('detail',oid=r.id)}}">Ver detalhes <span aria-hidden="true">→</span></a></article>{% endfor %}
